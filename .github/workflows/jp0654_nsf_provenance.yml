name: JP NSF Original-ROM Provenance (ROM-free)
on:
  push:
    branches: [decompilation]
    paths:
      - "JP/decomp/tools/jp_nsf_rom_crosswalk_0654.py"
      - "JP/decomp/analysis/0654_ORIGINAL_JP_NSF_ROM_CROSSWALK.md"
      - ".github/workflows/jp0654_nsf_provenance.yml"
  pull_request:
    paths:
      - "JP/decomp/tools/jp_nsf_rom_crosswalk_0654.py"
      - "JP/decomp/analysis/0654_ORIGINAL_JP_NSF_ROM_CROSSWALK.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-nsf-crosswalk:
    name: NSF 13-bank/28-track synthetic gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout only original-ROM-free public source
        uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify 13-bank physical provenance and eight corrupt inputs (no commercial media)
        run: python JP/decomp/tools/jp_nsf_rom_crosswalk_0654.py --smoke
