name: NEStudio Windows Desktop and Editor Contracts

on:
  push:
    branches:
      - feature/nestudio-foundation
    paths:
      - 'JP/recomp/nestudio/**'
      - 'JP/recomp/tools/patch_cyc_lighting_editor.py'
      - 'JP/recomp/native/enhanced/cviii_nestudio_host_bridge.h'
      - '.github/workflows/nestudio-windows.yml'
  pull_request:
    paths:
      - 'JP/recomp/nestudio/**'
      - 'JP/recomp/tools/patch_cyc_lighting_editor.py'
      - 'JP/recomp/native/enhanced/cviii_nestudio_host_bridge.h'
  workflow_dispatch:

jobs:
  nestudio:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source (no private ROM)
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: ROM-free project and dialogue editor contracts
        shell: pwsh
        run: |
          dotnet run --project JP/recomp/nestudio/NEStudio.Tests/NEStudio.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Private SDL overlay integration contract
        shell: pwsh
        run: |
          python JP/recomp/tools/patch_cyc_lighting_editor.py --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile actual Win64 C11 SDL bridge ABI (no ROM)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VS_ROOT=%%i"
          if not defined VS_ROOT exit /b 1
          call "%VS_ROOT%\Common7\Tools\VsDevCmd.bat" -arch=amd64
          if errorlevel 1 exit /b 1
          cl /nologo /TC /W3 /c /Fo:"%RUNNER_TEMP%\nestudio_bridge.obj" JP\recomp\nestudio\BridgeCompileSmoke.c
          if errorlevel 1 exit /b 1
          cl /nologo /TC /W3 /Fe:"%RUNNER_TEMP%\nestudio_oam_owner_smoke.exe" JP\recomp\nestudio\OamOwnerSmoke.c
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\nestudio_oam_owner_smoke.exe"
          if errorlevel 1 exit /b 1
          cl /nologo /TC /W3 /Fe:"%RUNNER_TEMP%\nestudio_ec47_trace_smoke.exe" JP\recomp\nestudio\Ec47TraceSmoke.c
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\nestudio_ec47_trace_smoke.exe"
          if errorlevel 1 exit /b 1
      - name: Compile and publish real NEStudio.exe WPF desktop
        shell: pwsh
        run: |
          dotnet publish JP/recomp/nestudio/NEStudio.csproj -c Release -r win-x64 --self-contained false -o "$env:RUNNER_TEMP/NEStudio"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$env:RUNNER_TEMP/NEStudio/NEStudio.exe")) {
            throw 'Native Windows NEStudio.exe missing from publish output'
          }
      - name: Package ROM-free application
        uses: actions/upload-artifact@v4
        with:
          name: NEStudio-Windows-editor-only
          path: ${{ runner.temp }}/NEStudio
          retention-days: 10
