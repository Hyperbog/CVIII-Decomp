name: CVIII Windows Alpha Candidate Builder
on:
  pull_request:
    paths:
      - "JP/decomp/**"
      - "JP/recomp/**"
      - ".github/workflows/jp_alpha_windows.yml"
  push:
    branches: [decompilation]
    paths:
      - "JP/recomp/release/alpha/**"
      - "JP/decomp/tools/build_private_asm_reference_0627.py"
      - "JP/decomp/tools/test_private_asm_reference_0627.py"
      - "JP/decomp/tools/audit_room_selector_window_0628.py"
      - "JP/decomp/tools/audit_room_selector_table_0629.py"
      - "JP/decomp/tools/audit_mesen_room_selector_trace_0629.py"
      - "JP/decomp/tools/mesen_jp_room_selector_provenance_0629.lua"
      - "JP/decomp/tools/mesen_jp_room_chain_0630.lua"
      - "JP/decomp/tools/audit_mesen_room_chain_0630.py"
      - "JP/recomp/tools/package_alpha_builder_0580.py"
      - "JP/recomp/tools/test_alpha_arguments_0604.ps1"
      - "JP/recomp/tools/test_alpha_python_0607.ps1"
      - "JP/decomp/tools/jp_password_*0593.py"
      - "JP/recomp/tools/jp_asset_pack_0597.py"
      - "JP/recomp/tools/jp_asset_runtime_0598.py"
      - "JP/recomp/tools/patch_cyc_stage_menu_0594.py"
      - "JP/recomp/tools/patch_cyc_stage_bootstrap_0596.py"
      - "JP/recomp/tools/patch_cyc_audio_menu_0620.py"
      - "JP/recomp/tools/patch_cyc_start_menu_0623.py"
      - "JP/decomp/tools/jp_start_menu_pinned_gate_0623.py"
      - "JP/decomp/tools/jp_start_pause_shell_test_0624.py"
      - "JP/recomp/tools/patch_cyc_slot_picker_0625.py"
      - "JP/decomp/tools/jp_slot_picker_pinned_gate_0625.py"
      - "JP/decomp/tools/jp_slot_shell_test_0625.py"
      - "JP/recomp/tools/jp_menu_roundtrip_shell_test_0644.py"
      - "JP/recomp/tools/patch_cyc_audio_return_0626.py"
      - "JP/decomp/tools/jp_audio_return_pinned_gate_0626.py"
      - "JP/decomp/tools/jp_audio_menu_pinned_gate_0621.py"
      - "JP/recomp/tools/patch_cyc_chr_fetch_0600.py"
      - "JP/recomp/tools/patch_cyc_ppu_nt_0606.py"
      - "JP/recomp/tools/jp_nt_trace_report_0606.py"
      - "JP/recomp/tools/jp_object_oam_report_0609.py"
      - "JP/recomp/tools/patch_cyc_audio_bus_0610.py"
      - "JP/recomp/tools/patch_cyc_sound_requests_0612.py"
      - "JP/recomp/tools/patch_cyc_sound_decisions_0646.py"
      - "JP/decomp/tools/jp_dmc_original_source_0648.py"
      - "JP/decomp/tools/jp_sound_catalog_0652.py"
      - "JP/decomp/tools/jp_phrase_lookup_0653.py"
      - "JP/decomp/tools/jp_phrase_delta_0655.py"
      - "JP/decomp/tools/jp_phrase_control_0656.py"
      - "JP/decomp/tools/jp_room_catalog_0657.py"
      - "JP/decomp/tools/jp_room_coordinate_0657.py"
      - "JP/decomp/tools/jp_room_clear_0658.py"
      - "JP/decomp/tools/jp_room_stream_0659.py"
      - "JP/decomp/tools/jp_room_resources_0659.py"
      - "JP/recomp/tools/test_control_profiles_0661.py"
      - "JP/decomp/tools/jp_dpcm_memory_audit_0649.py"
      - "JP/recomp/tools/patch_cyc_dmc_dma_trace_0650.py"
      - "JP/decomp/tools/jp_dmc_dma_trace_verify_0650.py"
      - "JP/decomp/tools/patch_mesen_dmc_reference_0651.py"
      - "JP/decomp/tools/jp_mesen_dmc_dma_compare_0651.py"
      - "JP/recomp/tools/jp_audio_bus_report_0610.py"
      - "JP/recomp/tools/jp_audio_session_verify_0614.py"
      - "JP/decomp/tools/jp_mesen_sound_requests_0615.py"
      - "JP/decomp/tools/jp_sound_priority_paths_0616.py"
      - "JP/decomp/tools/jp_mesen_gate_report_0616.py"
      - "JP/decomp/tools/jp_sound_decision_reference_0617.py"
      - "JP/decomp/tools/jp_audio_ui_chr_0619.py"
      - "JP/decomp/tools/mesen_jp_sound_decisions_0617.lua"
      - "JP/decomp/tools/mesen_jp_sound_gates_0616.lua"
      - "JP/decomp/tools/mesen_jp_sound_requests_0615.lua"
      - "JP/recomp/tools/jp_chr_fetch_report_0600.py"
      - "JP/recomp/tools/jp_frame_evidence_report_0601.py"
      - "JP/decomp/tools/jp_qa_matrix_0602.py"
      - "JP/decomp/tools/jp_mapper_audit_0602.py"
      - "JP/recomp/native/nesrecomp_cycle/**"
      - "JP/recomp/native/enhanced/**"
      - "JP/decomp/tools/jp_sprite_emission_source_0645.py"
      - ".github/workflows/jp_alpha_windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windowed-native-c11:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout CVIII source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned external NESRecomp PolyForm Noncommercial runtime
        uses: actions/checkout@v4
        with:
          repository: mstan/nesrecomp
          ref: 2b4fcdb98c9e702be3fb365cfc645003c50b5fc1
          path: _external_nesrecomp
          persist-credentials: false
      - name: Check external license and create artificial mapper24 cartridge
        shell: pwsh
        run: |
          if (!(Select-String -LiteralPath '_external_nesrecomp/LICENSE' -Pattern 'PolyForm Noncommercial License 1.0.0' -Quiet)) { throw 'Wrong upstream license' }
          python JP/decomp/tools/test_cycle_synthetic_rom_0569.py --out "$env:RUNNER_TEMP\alpha-vrc6.nes"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic VRC6 media generation failed' }
      - name: Verify compiled Windows product accounting (ROM-free)
        shell: pwsh
        run: |
          python JP/recomp/tools/test_verify_compiled_product.py
          if ($LASTEXITCODE -ne 0) { throw 'Compiled PRG acceptance contract failed' }
      - name: Verify Enhanced save/load continuation contract (ROM-free)
        shell: pwsh
        run: |
          python JP/recomp/tools/test_verify_enhanced_save_roundtrip.py
          if ($LASTEXITCODE -ne 0) { throw 'Enhanced full-machine state acceptance contract failed' }
      - name: JP0725 verify real Windows 426x240 native framebuffer (synthetic layout)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'jp0725-world-test'
          cmake -S JP/recomp/native/enhanced/jp0725_test -B $out -A x64 "-DNESRECOMP_EXTERNAL_ROOT=$pwd/_external_nesrecomp"
          if ($LASTEXITCODE -ne 0) { throw 'JP0725 Windows CMake configure failed' }
          cmake --build $out --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'JP0725 Windows native build failed' }
          ctest --test-dir $out -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'JP0725 Windows native framebuffer test failed' }
      - name: JP0731 MSVC build content-only runtime without ROM/compiler
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'jp0731-content-only'
          cmake -S JP/recomp/native/content_runtime -B $out -A x64
          if ($LASTEXITCODE -ne 0) { throw 'ROM-free content-only configure failed' }
          cmake --build $out --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'ROM-free content-only MSVC build failed' }
          ctest --test-dir $out -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'JP0731 runtime/cache/TSA regression failed' }
      - name: JP0732 MSVC build complete ROM-independent interpreter game host
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'jp0732-interpreter-game'
          cmake -S JP/recomp/native/rom_runtime_0732 -B $out -A x64 "-DNESRECOMP_EXTERNAL_ROOT=$pwd/_external_nesrecomp" -DJP0732_WINDOWED=OFF -DJP0732_ENHANCED=ON
          if ($LASTEXITCODE -ne 0) { throw 'JP0732 no-ROM gameplay host configure failed' }
          cmake --build $out --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'JP0732 no-ROM gameplay host MSVC build failed' }
          $exe=Join-Path $out 'Release/jp_akumajou_runtime_0732.exe'
          & $exe "$env:RUNNER_TEMP\alpha-vrc6.nes" --frames 1
          if ($LASTEXITCODE -ne 3) { throw 'Production JP0733 launcher failed to reject the invented test cartridge' }
          Write-Host 'PASS: production no-ROM-at-build executable rejects incorrect source SHA256'
          $global:LASTEXITCODE=0 # checked rejection is expected, not a CI failure
      - name: Check stage and companion password debug selector
        shell: pwsh
        run: |
          python JP/decomp/tools/jp_password_debug_menu_0593.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "Stage/companion debug contract failed" }
      - name: Verify JP0627 full cartridge assembly round-trip generator (synthetic only)
        shell: pwsh
        run: |
          python JP/decomp/tools/test_private_asm_reference_0627.py
          if ($LASTEXITCODE -ne 0) { throw 'JP0627 bank reference regeneration failed' }
      - name: Verify JP0629 source-identified Mesen event parser (ROM-free)
        shell: pwsh
        run: |
          python JP/decomp/tools/audit_mesen_room_selector_trace_0629.py --smoke
          if ($LASTEXITCODE -ne 0) { throw 'JP0629 Mesen trace validator smoke failed' }
          python -m py_compile JP/decomp/tools/audit_room_selector_table_0629.py
          if ($LASTEXITCODE -ne 0) { throw 'JP0629 room selector table audit compile failed' }
          python JP/decomp/tools/audit_mesen_room_chain_0630.py --smoke
          if ($LASTEXITCODE -ne 0) { throw 'JP0630 Mesen room chain parser smoke failed' }
      - name: Verify JP0628 mapper-aware selector hazard guard (ROM-free)
        shell: pwsh
        run: |
          python JP/decomp/tools/audit_room_selector_window_0628.py --smoke
          if ($LASTEXITCODE -ne 0) { throw 'JP0628 selector audit smoke failed' }
      - name: Test deterministic ROM-free asset cache and copyright boundary
        shell: pwsh
        run: |
          python JP/recomp/tools/jp_asset_pack_0597.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0597 asset pack contract failed" }
          python JP/recomp/tools/jp_asset_runtime_0598.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0598 native CHR index contract failed" }
      - name: Validate F10 stage menu overlay against pinned SDL host contract
        shell: pwsh
        run: |
          python JP/recomp/tools/patch_cyc_stage_menu_0594.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "F10 stage menu patch test failed" }
          python JP/recomp/tools/patch_cyc_stage_bootstrap_0596.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "F10 password bootstrap patch test failed" }
          python JP/recomp/tools/patch_cyc_audio_menu_0620.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0620 F6 paused authentic audio menu patch test failed" }
          python JP/decomp/tools/jp_audio_menu_pinned_gate_0621.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0621 layered audio menu source smoke failed" }
          python JP/decomp/tools/jp_audio_menu_pinned_gate_0621.py --source _external_nesrecomp/runner/cyc/cyc_sdl.c
          if ($LASTEXITCODE -ne 0) { throw "JP0621 pinned SDL four-overlay source contract failed" }
          python JP/decomp/tools/jp_start_menu_pinned_gate_0623.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0623 Start/Pause patch smoke failed" }
          python JP/decomp/tools/jp_start_menu_pinned_gate_0623.py --source _external_nesrecomp/runner/cyc/cyc_sdl.c
          if ($LASTEXITCODE -ne 0) { throw "JP0623 five-overlay SDL source regression failed" }
          python JP/decomp/tools/jp_slot_picker_pinned_gate_0625.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0625 source patch smoke failed" }
          python JP/decomp/tools/jp_slot_picker_pinned_gate_0625.py --source _external_nesrecomp/runner/cyc/cyc_sdl.c
          if ($LASTEXITCODE -ne 0) { throw "JP0625 six-layer pinned SDL source gate failed" }
          python JP/decomp/tools/jp_audio_return_pinned_gate_0626.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0626 Audio return patch smoke failed" }
          python JP/decomp/tools/jp_audio_return_pinned_gate_0626.py --source _external_nesrecomp/runner/cyc/cyc_sdl.c
          if ($LASTEXITCODE -ne 0) { throw "JP0626 seventh-layer pinned SDL source gate failed" }
          python JP/recomp/tools/patch_cyc_chr_fetch_0600.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "PPU CHR observer anchor test failed" }
          python JP/recomp/tools/patch_cyc_ppu_nt_0606.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0606 PPU nametable observer contract failed" }
          python JP/recomp/tools/jp_nt_trace_report_0606.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0606 background bus report test failed" }
          python JP/recomp/tools/jp_object_oam_report_0609.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0609 logical OAM-priority inversion report failed" }
          python JP/recomp/tools/patch_cyc_audio_bus_0610.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0610 audio backend observer patch rejected" }
          python JP/recomp/tools/patch_cyc_dmc_dma_trace_0650.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0650 real DMA-source private overlay contract rejected" }
          python JP/recomp/tools/patch_cyc_sound_requests_0612.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0612 sound fetch gate failed" }
          python JP/recomp/tools/patch_cyc_sound_decisions_0646.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0646 exact original driver sound-decision patch failed" }
          if ($LASTEXITCODE -ne 0) { throw "JP0612 sound request CPU-fetch patch rejected" }
          python JP/decomp/tools/jp_sound_priority_paths_0616.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0616 sound-gate branch fixture failed" }
          python JP/decomp/tools/jp_sound_decision_reference_0617.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0617 original sound-decision parser failed" }
          python JP/decomp/tools/jp_mesen_gate_report_0616.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0616 original gate pairing validation failed" }
          python JP/decomp/tools/jp_mesen_sound_requests_0615.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0615 Mesen sound request proof parser failed" }
          python JP/recomp/tools/jp_audio_session_verify_0614.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0614 audio session validator rejected" }
          python JP/recomp/tools/jp_audio_bus_report_0610.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0610 audio traffic report failed" }
          python JP/recomp/tools/jp_chr_fetch_report_0600.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "Private PPU CHR CSV report parser test failed" }
          python JP/recomp/tools/jp_frame_evidence_report_0601.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "Paired original PPU/frame evidence report failed" }
          python JP/decomp/tools/jp_mapper_audit_0602.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0602 mapper/palette alignment smoke failed" }
          python JP/decomp/tools/jp_qa_matrix_0602.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "Owner-local gameplay QA matrix contract failed" }
      - name: Validate private QA capture and build launcher PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('JP/recomp/release/alpha/Capture-QA-0602.ps1','JP/recomp/release/alpha/Launch-Alpha.ps1','JP/recomp/release/alpha/Build-Alpha.ps1','JP/recomp/release/alpha/Verify-Compiled.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $file).Path,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ("PowerShell syntax check failed: " + $file + ": " + ($parseErrors | Out-String)) }
          }
      - name: Validate in-game F7 keyboard bindings and direct F4 F6 F10 menu routing (ROM-free)
        shell: pwsh
        run: |
          python JP/recomp/tools/patch_cyc_live_menus_0761.py --smoke
          if ($LASTEXITCODE -ne 0) { throw 'JP0761 F7 live menu overlay regression' }
      - name: Verify Enhanced sprite preferences survive Windows launcher restarts (ROM-free)
        shell: pwsh
        run: |
          & JP/recomp/tools/test_alpha_sprite_options_0750.ps1

      - name: Validate private AlphaCandidate companion sources (ROM-free)
        shell: pwsh
        run: |
          # Extract the actual manifest function, not a shadow copy of paths.
          $tokens=$null
          $errs=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'JP/recomp/release/alpha/Build-Alpha.ps1').Path,
            [ref]$tokens,[ref]$errs)
          if ($errs.Count -ne 0) { throw ($errs | Out-String) }
          $fn=$ast.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
            $node.Name -eq 'Get-CviiiAlphaCompanionSources'
          },$true)
          if (-not $fn) { throw 'Builder companion source manifest function missing' }
          Invoke-Expression $fn.Extent.Text
          $files=@(Get-CviiiAlphaCompanionSources -RepoPath (Get-Location).Path)
          if ($files.Count -ne 29) { throw "Expected 29 private companion files, got $($files.Count)" }
          if (@($files | Select-Object -ExpandProperty Name -Unique).Count -ne $files.Count) {
            throw 'Duplicate private AlphaCandidate destination names'
          }
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file.Source -PathType Leaf)) {
              throw ('Builder references missing private companion source: '+$file.Source)
            }
          }
          Write-Host "PASS: all $($files.Count) actual private AlphaCandidate companion sources exist"
      - name: Validate JP0603 ROM-free first-run builder and launcher contract
        shell: pwsh
        run: |
          python JP/recomp/tools/package_alpha_builder_0580.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "ROM-free first-run build kit test failed" }
          foreach ($file in @('JP/recomp/release/alpha/Build-And-Play.ps1','JP/recomp/release/alpha/Build-Alpha.ps1','JP/recomp/release/alpha/Launch-Alpha.ps1')) {
            $tokens = $null
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errs) | Out-Null
            if ($errs.Count -ne 0) { throw ("PowerShell syntax error: "+$file+": "+($errs | Out-String)) }
          }
          $source = Get-Content -LiteralPath 'JP/recomp/release/alpha/Build-And-Play.ps1' -Raw
          if ($source -notmatch 'Get-FileHash' -or $source -notmatch 'Test-PrivateGame' -or $source -notmatch 'Build-Alpha.ps1' -or $source -notmatch 'LastRomPath.txt') {
            throw "Missing first-run original-ROM authentication and build fallback"
          }
      - name: Verify JP0604 real Git clone/pull argument forwarding
        shell: pwsh
        run: |
          & JP/recomp/tools/test_alpha_arguments_0604.ps1
          if ($LASTEXITCODE -ne 0) { throw "Actual native builder argument forwarding failed" }
      - name: Test actual Python3 discovery and reject Windows Store alias 9009
        shell: pwsh
        run: |
          & JP/recomp/tools/test_alpha_python_0607.ps1
          if ($LASTEXITCODE -ne 0) { throw 'JP0607 Python resolution regression' }
          $builder = Get-Content -LiteralPath 'JP/recomp/release/alpha/Build-Alpha.ps1' -Raw
          if ($builder -match "Invoke-Checked -Program 'python'" -or
              $builder -notmatch 'Resolve-CviiiPython' -or
              $builder -notmatch 'JP/recomp/release/alpha/Resolve-Python.ps1') {
            throw 'Builder bypasses verified Python interpreter'
          }
      - name: Verify single public Enhanced entry and internal reference isolation
        shell: pwsh
        run: |
          $kit = Get-Content -LiteralPath 'JP/recomp/tools/package_alpha_builder_0580.py' -Raw
          $launcher = Get-Content -LiteralPath 'JP/recomp/release/alpha/Play-CVIII.bat' -Raw
          $entry = Get-Content -LiteralPath 'JP/recomp/release/alpha/Build-And-Play.ps1' -Raw
          $script = Get-Content -LiteralPath 'JP/recomp/release/alpha/Launch-Alpha.ps1' -Raw
          if ($launcher -notmatch 'Edition Enhanced') { throw 'Main Play shortcut must be Enhanced' }
          if ($entry -notmatch '\$Edition=''Enhanced''') { throw 'First-run default must be Enhanced' }
          if ($script -notmatch '\$Edition=''Enhanced''') { throw 'Private launcher default must be Enhanced' }
          if ($kit -match 'Play-Original.bat') {
            # Only the ROM-free smoke assertion may reference this name.
            if ($kit -notmatch 'not in kit.namelist') { throw 'Original included in public kit' }
          }
          $builder = Get-Content -LiteralPath 'JP/recomp/release/alpha/Build-Alpha.ps1' -Raw
          if ($builder.IndexOf('Remove-Item -LiteralPath $obsolete') -lt 0 -or
              $builder.IndexOf('Remove-Item -LiteralPath $obsolete') -gt $builder.IndexOf('Compress-Archive -Path')) {
            throw 'Legacy public edition shortcuts must be removed BEFORE packaging'
          }
          python JP/recomp/tools/package_alpha_builder_0580.py --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Public Enhanced-only packaging test failed' }
      - name: Compile SDL2 windowed C11 alpha target
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win'
          $rom = Join-Path $env:RUNNER_TEMP 'alpha-vrc6.nes'
          $engine = (Resolve-Path '_external_nesrecomp').Path
          cmake -S JP/recomp/native/nesrecomp_cycle -B $build -G "Visual Studio 17 2022" -A x64 -DJP_ORIGINAL_JP_ROM="$rom" -DNESRECOMP_EXTERNAL_ROOT="$engine" -DJP_CYCLE_SYNTHETIC_MEDIA=ON -DJP_CYCLE_HEADLESS=OFF -DNESRECOMP_RECOMP_UI=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Windowed CMake generation failed' }
          cmake --build $build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Windows C11 cycle build failed' }
          $bin = Join-Path $build 'Release'
          if (!(Test-Path (Join-Path $bin 'jp_akumajou_densetsu.exe'))) { throw 'Windows executable missing' }
          if (!(Test-Path (Join-Path $bin 'SDL2.dll'))) { throw 'SDL2.dll missing: not playable' }
      - name: Verify C11 read-only CHR index and synthetic content rejection
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win/Release/jp_chr_index_test_0598.exe'
          if (!(Test-Path $test)) { throw "C11 CHR index smoke executable missing" }
          & $test
          if ($LASTEXITCODE -ne 0) { throw "C11 CHR index reader check failed" }
      - name: Check read-only VRC6 CHR bank mapping C11 mode contracts
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win/Release/jp_chr_audit_test_0599.exe'
          if (!(Test-Path $test)) { throw "VRC6 CHR mapper audit test missing" }
          & $test
          if ($LASTEXITCODE -ne 0) { throw "VRC6 CHR mapper page logic failed" }
      - name: Verify actual PPU fetch accounting and within-line CHR switches
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win/Release/jp_chr_fetch_test_0600.exe'
          if (!(Test-Path $test)) { throw 'JP0600 CHR fetch test executable missing' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw 'JP0600 physical CHR audit regression failed' }
      - name: Verify synchronized original PPU frame evidence C11 contract
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win/Release/jp_frame_evidence_test_0601.exe'
