name: CVIII Windows Alpha Candidate Builder
on:
  push:
    branches: [decompilation]
    paths:
      - "JP/release/alpha/**"
      - "JP/tools/package_alpha_builder_0580.py"
      - "JP/tools/test_alpha_arguments_0604.ps1"
      - "JP/tools/test_alpha_python_0607.ps1"
      - "JP/tools/jp_password_*0593.py"
      - "JP/tools/jp_asset_pack_0597.py"
      - "JP/tools/jp_asset_runtime_0598.py"
      - "JP/tools/patch_cyc_stage_menu_0594.py"
      - "JP/tools/patch_cyc_stage_bootstrap_0596.py"
      - "JP/tools/patch_cyc_chr_fetch_0600.py"
      - "JP/tools/patch_cyc_ppu_nt_0606.py"
      - "JP/tools/jp_nt_trace_report_0606.py"
      - "JP/tools/jp_object_oam_report_0609.py"
      - "JP/tools/patch_cyc_audio_bus_0610.py"
      - "JP/tools/patch_cyc_sound_requests_0612.py"
      - "JP/tools/jp_audio_bus_report_0610.py"
      - "JP/tools/jp_audio_session_verify_0614.py"
      - "JP/tools/jp_chr_fetch_report_0600.py"
      - "JP/tools/jp_frame_evidence_report_0601.py"
      - "JP/tools/jp_qa_matrix_0602.py"
      - "JP/tools/jp_mapper_audit_0602.py"
      - "JP/native/nesrecomp_cycle/**"
      - "JP/native/enhanced/**"
      - ".github/workflows/jp_alpha_windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windowed-native-c11:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout CVIII source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned external NESRecomp PolyForm Noncommercial runtime
        uses: actions/checkout@v4
        with:
          repository: mstan/nesrecomp
          ref: 2b4fcdb98c9e702be3fb365cfc645003c50b5fc1
          path: _external_nesrecomp
          persist-credentials: false
      - name: Check external license and create artificial mapper24 cartridge
        shell: pwsh
        run: |
          if (!(Select-String -LiteralPath '_external_nesrecomp/LICENSE' -Pattern 'PolyForm Noncommercial License 1.0.0' -Quiet)) { throw 'Wrong upstream license' }
          python JP/tools/test_cycle_synthetic_rom_0569.py --out "$env:RUNNER_TEMP\alpha-vrc6.nes"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic VRC6 media generation failed' }
      - name: Check stage and companion password debug selector
        shell: pwsh
        run: |
          python JP/tools/jp_password_debug_menu_0593.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "Stage/companion debug contract failed" }
      - name: Test deterministic ROM-free asset cache and copyright boundary
        shell: pwsh
        run: |
          python JP/tools/jp_asset_pack_0597.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0597 asset pack contract failed" }
          python JP/tools/jp_asset_runtime_0598.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0598 native CHR index contract failed" }
      - name: Validate F10 stage menu overlay against pinned SDL host contract
        shell: pwsh
        run: |
          python JP/tools/patch_cyc_stage_menu_0594.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "F10 stage menu patch test failed" }
          python JP/tools/patch_cyc_stage_bootstrap_0596.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "F10 password bootstrap patch test failed" }
          python JP/tools/patch_cyc_chr_fetch_0600.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "PPU CHR observer anchor test failed" }
          python JP/tools/patch_cyc_ppu_nt_0606.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0606 PPU nametable observer contract failed" }
          python JP/tools/jp_nt_trace_report_0606.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0606 background bus report test failed" }
          python JP/tools/jp_object_oam_report_0609.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0609 logical OAM-priority inversion report failed" }
          python JP/tools/patch_cyc_audio_bus_0610.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0610 audio backend observer patch rejected" }
          python JP/tools/patch_cyc_sound_requests_0612.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0612 sound request CPU-fetch patch rejected" }
          python JP/tools/jp_audio_session_verify_0614.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0614 audio session validator rejected" }
          python JP/tools/jp_audio_bus_report_0610.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0610 audio traffic report failed" }
          python JP/tools/jp_chr_fetch_report_0600.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "Private PPU CHR CSV report parser test failed" }
          python JP/tools/jp_frame_evidence_report_0601.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "Paired original PPU/frame evidence report failed" }
          python JP/tools/jp_mapper_audit_0602.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "JP0602 mapper/palette alignment smoke failed" }
          python JP/tools/jp_qa_matrix_0602.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "Owner-local gameplay QA matrix contract failed" }
      - name: Validate private QA capture and build launcher PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('JP/release/alpha/Capture-QA-0602.ps1','JP/release/alpha/Launch-Alpha.ps1','JP/release/alpha/Build-Alpha.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $file).Path,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ("PowerShell syntax check failed: " + $file + ": " + ($parseErrors | Out-String)) }
          }
      - name: Validate JP0603 ROM-free first-run builder and launcher contract
        shell: pwsh
        run: |
          python JP/tools/package_alpha_builder_0580.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "ROM-free first-run build kit test failed" }
          foreach ($file in @('JP/release/alpha/Build-And-Play.ps1','JP/release/alpha/Build-Alpha.ps1','JP/release/alpha/Launch-Alpha.ps1')) {
            $tokens = $null
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errs) | Out-Null
            if ($errs.Count -ne 0) { throw ("PowerShell syntax error: "+$file+": "+($errs | Out-String)) }
          }
          $source = Get-Content -LiteralPath 'JP/release/alpha/Build-And-Play.ps1' -Raw
          if ($source -notmatch 'Get-FileHash' -or $source -notmatch 'Test-PrivateGame' -or $source -notmatch 'Build-Alpha.ps1' -or $source -notmatch 'LastRomPath.txt') {
            throw "Missing first-run original-ROM authentication and build fallback"
          }
      - name: Verify JP0604 real Git clone/pull argument forwarding
        shell: pwsh
        run: |
          & JP/tools/test_alpha_arguments_0604.ps1
          if ($LASTEXITCODE -ne 0) { throw "Actual native builder argument forwarding failed" }
      - name: Test actual Python3 discovery and reject Windows Store alias 9009
        shell: pwsh
        run: |
          & JP/tools/test_alpha_python_0607.ps1
          if ($LASTEXITCODE -ne 0) { throw 'JP0607 Python resolution regression' }
          $builder = Get-Content -LiteralPath 'JP/release/alpha/Build-Alpha.ps1' -Raw
          if ($builder -match "Invoke-Checked -Program 'python'" -or
              $builder -notmatch 'Resolve-CviiiPython' -or
              $builder -notmatch 'JP/release/alpha/Resolve-Python.ps1') {
            throw 'Builder bypasses verified Python interpreter'
          }
      - name: Verify single public Enhanced entry and internal reference isolation
        shell: pwsh
        run: |
          $kit = Get-Content -LiteralPath 'JP/tools/package_alpha_builder_0580.py' -Raw
          $launcher = Get-Content -LiteralPath 'JP/release/alpha/Play-CVIII.bat' -Raw
          $entry = Get-Content -LiteralPath 'JP/release/alpha/Build-And-Play.ps1' -Raw
          $script = Get-Content -LiteralPath 'JP/release/alpha/Launch-Alpha.ps1' -Raw
          if ($launcher -notmatch 'Edition Enhanced') { throw 'Main Play shortcut must be Enhanced' }
          if ($entry -notmatch '\$Edition=''Enhanced''') { throw 'First-run default must be Enhanced' }
          if ($script -notmatch '\$Edition=''Enhanced''') { throw 'Private launcher default must be Enhanced' }
          if ($kit -match 'Play-Original.bat') {
            # Only the ROM-free smoke assertion may reference this name.
            if ($kit -notmatch 'not in kit.namelist') { throw 'Original included in public kit' }
          }
          $builder = Get-Content -LiteralPath 'JP/release/alpha/Build-Alpha.ps1' -Raw
          if ($builder.IndexOf('Remove-Item -LiteralPath $obsolete') -lt 0 -or
              $builder.IndexOf('Remove-Item -LiteralPath $obsolete') -gt $builder.IndexOf('Compress-Archive -Path')) {
            throw 'Legacy public edition shortcuts must be removed BEFORE packaging'
          }
          python JP/tools/package_alpha_builder_0580.py --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Public Enhanced-only packaging test failed' }
      - name: Compile SDL2 windowed C11 alpha target
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win'
          $rom = Join-Path $env:RUNNER_TEMP 'alpha-vrc6.nes'
          $engine = (Resolve-Path '_external_nesrecomp').Path
          cmake -S JP/native/nesrecomp_cycle -B $build -G "Visual Studio 17 2022" -A x64 -DJP_ORIGINAL_JP_ROM="$rom" -DNESRECOMP_EXTERNAL_ROOT="$engine" -DJP_CYCLE_SYNTHETIC_MEDIA=ON -DJP_CYCLE_HEADLESS=OFF -DNESRECOMP_RECOMP_UI=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Windowed CMake generation failed' }
          cmake --build $build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Windows C11 cycle build failed' }
          $bin = Join-Path $build 'Release'
          if (!(Test-Path (Join-Path $bin 'jp_akumajou_densetsu.exe'))) { throw 'Windows executable missing' }
          if (!(Test-Path (Join-Path $bin 'SDL2.dll'))) { throw 'SDL2.dll missing: not playable' }
      - name: Verify C11 read-only CHR index and synthetic content rejection
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win/Release/jp_chr_index_test_0598.exe'
          if (!(Test-Path $test)) { throw "C11 CHR index smoke executable missing" }
          & $test
          if ($LASTEXITCODE -ne 0) { throw "C11 CHR index reader check failed" }
      - name: Check read-only VRC6 CHR bank mapping C11 mode contracts
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win/Release/jp_chr_audit_test_0599.exe'
          if (!(Test-Path $test)) { throw "VRC6 CHR mapper audit test missing" }
          & $test
          if ($LASTEXITCODE -ne 0) { throw "VRC6 CHR mapper page logic failed" }
      - name: Verify actual PPU fetch accounting and within-line CHR switches
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win/Release/jp_chr_fetch_test_0600.exe'
          if (!(Test-Path $test)) { throw 'JP0600 CHR fetch test executable missing' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw 'JP0600 physical CHR audit regression failed' }
      - name: Verify synchronized original PPU frame evidence C11 contract
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win/Release/jp_frame_evidence_test_0601.exe'
          if (!(Test-Path $test)) { throw 'JP0601 PPU evidence test missing' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw 'JP0601 PPU evidence contract failed' }
      - name: Verify original PPU nametable / attribute fetch observer
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win/Release/jp_nt_trace_test_0606.exe'
          if (!(Test-Path -LiteralPath $test)) { throw "JP0606 PPU background test missing" }
          & $test
          if ($LASTEXITCODE -ne 0) { throw "JP0606 original PPU background fetch test failed" }
      - name: Verify independent temporal sprite layers and OAM priority
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win/Release/jp_sprite_layers_test_0608.exe'
          if (!(Test-Path -LiteralPath $test)) { throw "JP0608 sprite layer test missing" }
          & $test
          if ($LASTEXITCODE -ne 0) { throw "JP0608 synthetic sprite layer test failed" }
      - name: Verify game object/OAM read-only physical rotation sample
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win/Release/jp_object_oam_test_0609.exe'
          if (!(Test-Path -LiteralPath $test)) { throw 'JP0609 original object/OAM test missing' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw 'JP0609 object to OAM shadow regression failed' }
      - name: Verify original APU + VRC6 audio traffic isolation (ROM-free)
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win/Release/jp_audio_bus_test_0610.exe'
          if (!(Test-Path -LiteralPath $test)) { throw 'JP0610 audio diagnostic test missing' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw 'JP0610 original audio write integrity test failed' }
      - name: Verify JP0612 original sound-request ingress logger (ROM-free)
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win/Release/jp_sound_requests_test_0612.exe'
          if (!(Test-Path -LiteralPath $test)) { throw 'JP0612 request observer test missing' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw 'JP0612 sound entry logger failed' }
      - name: Validate JP0614 owner-local epoch boundary logger (ROM-free)
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win/Release/jp_audio_session_test_0614.exe'
          if (!(Test-Path -LiteralPath $test)) { throw 'JP0614 epoch boundary test missing' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw 'JP0614 save-state boundary regression failed' }
      - name: Run bounded native C11 synthetic test with actual windowed-linked binary
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'cvi-alpha-win'
          $exe = Join-Path $build 'Release/jp_akumajou_densetsu.exe'
          $rom = Join-Path $env:RUNNER_TEMP 'alpha-vrc6.nes'
          $log = Join-Path $env:RUNNER_TEMP 'alpha-cycle.txt'
          $hash = Join-Path $env:RUNNER_TEMP 'alpha-frames.txt'
          $png = Join-Path $env:RUNNER_TEMP 'alpha-last.png'
          & $exe $rom --frames 3 --hash-out $hash --screenshot $png | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic mapper24 game execution failed' }
          python JP/tools/check_cycle_stats_0571.py --log $log --frames 3
          if ($LASTEXITCODE -ne 0) { throw 'Native-cycle counts invalid' }
          python JP/tools/validate_frame_artifacts_0578.py --hash-out $hash --screenshot $png --frames 3
          if ($LASTEXITCODE -ne 0) { throw 'Frame hashes/PNG invalid' }
      - name: Create ROM-free Windows alpha build kit
        shell: pwsh
        run: |
          python JP/tools/package_alpha_builder_0580.py --out CVIII-Alpha-Builder-0.2.0-alpha.1.zip
          if ($LASTEXITCODE -ne 0) { throw 'ROM-free packaging failed' }
      - name: Upload build kit, not commercial ROM or game executable
        uses: actions/upload-artifact@v4
        with:
          name: CVIII-Alpha-Builder-0.2.0-alpha.1
          path: CVIII-Alpha-Builder-0.2.0-alpha.1.zip
          if-no-files-found: error
          retention-days: 30
