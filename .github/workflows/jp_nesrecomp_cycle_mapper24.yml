      - "JP/recomp/tools/jp_chr_fetch_report_0600.py"
      - "JP/recomp/tools/jp_frame_evidence_report_0601.py"
      - "JP/decomp/tools/jp_qa_matrix_0602.py"
      - "JP/decomp/tools/jp_mapper_audit_0602.py"
      - "JP/decomp/tools/test_ppu_backend_0590.py"
      - "JP/decomp/tools/nesrecomp_cycle_0568.py"
      - "JP/recomp/tools/build_retail_cycle_0575.py"
      - "JP/recomp/native/nesrecomp_cycle/**"
      - ".github/workflows/jp_nesrecomp_cycle_mapper24.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mapper24-headless-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CVIII C11 integration
        uses: actions/checkout@v4
      - name: Checkout pinned external NESRecomp cycle engine (PolyForm Noncommercial 1.0.0)
        uses: actions/checkout@v4
        with:
          repository: mstan/nesrecomp
          ref: 2b4fcdb98c9e702be3fb365cfc645003c50b5fc1
          path: _external_nesrecomp
          persist-credentials: false
      - name: Verify external noncommercial license and cycle interface
        run: |
          grep -q "PolyForm Noncommercial License 1.0.0" _external_nesrecomp/LICENSE
          test -f _external_nesrecomp/runner/cyc/project.cmake
          python3 JP/decomp/tools/test_cycle_synthetic_rom_0569.py --smoke
      - name: Verify JP0627 private bank-addressed ROM source generator (synthetic only)
        run: |
          python3 JP/decomp/tools/test_private_asm_reference_0627.py
      - name: Verify JP0629 original-Mesen trace validation guards (ROM-free)
        run: |
          python3 JP/decomp/tools/audit_mesen_room_selector_trace_0629.py --smoke
          python3 -m py_compile JP/decomp/tools/audit_room_selector_table_0629.py
          python3 JP/decomp/tools/audit_mesen_room_chain_0630.py --smoke
      - name: Verify JP0628 raw0A room selector guard (ROM-free)
        run: python3 JP/decomp/tools/audit_room_selector_window_0628.py --smoke
      - name: Validate PPU diagnostic backend choice (no ROM)
        run: python3 JP/decomp/tools/test_ppu_backend_0590.py
      - name: Verify Original/Enhanced ten-slot save state host patch (no ROM)
        run: |
          python3 JP/recomp/tools/patch_cyc_savestates_0591.py --smoke
          python3 JP/recomp/tools/patch_cyc_audio_menu_0620.py --smoke
          python3 JP/decomp/tools/jp_audio_menu_pinned_gate_0621.py --smoke
          python3 JP/decomp/tools/jp_audio_menu_pinned_gate_0621.py \
            --source _external_nesrecomp/runner/cyc/cyc_sdl.c
          python3 JP/decomp/tools/jp_start_menu_pinned_gate_0623.py --smoke
          python3 JP/decomp/tools/jp_start_menu_pinned_gate_0623.py \
            --source _external_nesrecomp/runner/cyc/cyc_sdl.c
          python3 JP/decomp/tools/jp_slot_picker_pinned_gate_0625.py --smoke
          python3 JP/decomp/tools/jp_slot_picker_pinned_gate_0625.py \
            --source _external_nesrecomp/runner/cyc/cyc_sdl.c
          python3 JP/decomp/tools/jp_audio_return_pinned_gate_0626.py --smoke
          python3 JP/decomp/tools/jp_audio_return_pinned_gate_0626.py \
            --source _external_nesrecomp/runner/cyc/cyc_sdl.c
          python3 JP/recomp/tools/patch_cyc_savestates_0591.py \
            --source _external_nesrecomp/runner/cyc/cyc_sdl.c \
            --out _external_nesrecomp/runner/cyc/cviii_cyc_sdl_slots.c
          test -f _external_nesrecomp/runner/cyc/cviii_cyc_sdl_slots.c
      - name: Test Original/Enhanced C11 presentation extension (no ROM)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -I _external_nesrecomp/runner/cyc \
            JP/recomp/native/enhanced/cviii_edition.c JP/recomp/native/enhanced/cviii_chr_index_0598.c JP/recomp/native/enhanced/cviii_chr_audit_0599.c JP/recomp/native/enhanced/cviii_chr_fetch_0600.c JP/recomp/native/enhanced/cviii_frame_evidence_0601.c JP/recomp/native/enhanced/cviii_nt_trace_0606.c JP/recomp/native/enhanced/cviii_stage1_rom_0724.c JP/recomp/native/enhanced/cviii_stage1_atlas_0724.c JP/recomp/native/enhanced/cviii_stage1_host_0725.c JP/recomp/native/enhanced/cviii_runtime_resources_0727.c JP/recomp/native/enhanced/cviii_sprite_layers_0608.c JP/recomp/native/enhanced/cviii_object_oam_trace_0609.c JP/recomp/native/enhanced/cviii_audio_bus_0610.c JP/recomp/native/enhanced/cviii_sound_requests_0612.c JP/recomp/native/enhanced/cviii_sound_decisions_0646.c JP/recomp/native/enhanced/cviii_dmc_dma_trace_0650.c JP/recomp/native/enhanced/cviii_audio_session_0614.c JP/recomp/native/enhanced/cviii_audio_levels_0618.c JP/recomp/native/enhanced/cviii_virtual_audio_0647.c JP/recomp/native/enhanced/cviii_audio_ui_0619.c JP/recomp/native/enhanced/cviii_menu_registry_0620.c JP/recomp/native/enhanced/cviii_audio_menu_state_0622.c JP/recomp/native/enhanced/cviii_start_menu_0623.c JP/recomp/native/enhanced/cviii_start_ui_0623.c JP/recomp/native/enhanced/cviii_slot_picker_0625.c JP/recomp/native/enhanced/cviii_menu_stack_0626.c JP/recomp/native/enhanced/test_cviii_edition.c \
            -o "${{ runner.temp }}/test_cviii_edition"
          "${{ runner.temp }}/test_cviii_edition"
      - name: Test JP0723/JP0724 read-only Stage 1 ROM resource decoders (no ROM)
        run: |
          set -eu
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_ppu_queue_0723.c \
            JP/recomp/native/enhanced/cviii_ppu_queue_test_0723.c -o "${{ runner.temp }}/jp0723"
          "${{ runner.temp }}/jp0723"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_stage1_rom_0724.c \
            JP/recomp/native/enhanced/cviii_stage1_rom_test_0724.c -o "${{ runner.temp }}/jp0724"
          "${{ runner.temp }}/jp0724"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_stage1_rom_0724.c \
            JP/recomp/native/enhanced/cviii_stage1_atlas_0724.c \
            JP/recomp/native/enhanced/cviii_stage1_atlas_test_0724.c -o "${{ runner.temp }}/jp0724_atlas"
          "${{ runner.temp }}/jp0724_atlas"
      - name: JP0727 verify SHA256 and retail-vs-synthetic runtime resource contracts
        run: |
          set -eu
          for variant in production synthetic; do
            flags=""
            if [ "$variant" = synthetic ]; then flags="-DCVIII_RESOURCE_TEST_SYNTHETIC_0727=1"; fi
            cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic $flags \
              JP/recomp/native/enhanced/cviii_stage1_rom_0724.c \
              JP/recomp/native/enhanced/cviii_stage1_atlas_0724.c \
              JP/recomp/native/enhanced/cviii_runtime_resources_0727.c \
              JP/recomp/native/enhanced/cviii_runtime_resources_test_0727.c \
              -o "${{ runner.temp }}/jp0727_$variant"
            "${{ runner.temp }}/jp0727_$variant"
          done
      - name: Verify JP0618 enhanced PCM master level and 1-percent settings (ROM-free)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_audio_levels_0618.c \
            JP/recomp/native/enhanced/cviii_audio_levels_test_0618.c \
            -o "${{ runner.temp }}/test_audio_levels_0618"
          "${{ runner.temp }}/test_audio_levels_0618"
      - name: Verify JP0647 8+24 independent virtual-voice mixer (ROM-free)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -DNDEBUG \
            JP/recomp/native/enhanced/cviii_virtual_audio_0647.c \
            JP/recomp/native/enhanced/cviii_virtual_audio_test_0647.c \
            -o "${{ runner.temp }}/test_virtual_audio_0647"
          "${{ runner.temp }}/test_virtual_audio_0647"
      - name: Verify JP0647 separate bus scenario with overlapping sound effects and no interrupted music (ROM-free)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -DNDEBUG \
            JP/recomp/native/enhanced/cviii_audio_levels_0618.c \
            JP/recomp/native/enhanced/cviii_virtual_audio_0647.c \
            JP/recomp/native/enhanced/cviii_virtual_scene_test_0647.c \
            -o "${{ runner.temp }}/test_virtual_scene_0647"
          "${{ runner.temp }}/test_virtual_scene_0647"
      - name: Verify JP0619 CHR-faithful audio health bar preview (ROM-free)
        run: |
          python3 JP/decomp/tools/jp_audio_ui_chr_0619.py --smoke
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_audio_ui_0619.c \
            JP/recomp/native/enhanced/cviii_audio_levels_0618.c \
            JP/recomp/native/enhanced/cviii_audio_ui_test_0619.c \
            -o "${{ runner.temp }}/test_audio_ui_0619"
          "${{ runner.temp }}/test_audio_ui_0619"
      - name: Verify JP0620 mod-forward host menu registry and 1-percent controls
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_menu_registry_0620.c \
            JP/recomp/native/enhanced/cviii_audio_levels_0618.c \
            JP/recomp/native/enhanced/cviii_menu_registry_test_0620.c \
            -o "${{ runner.temp }}/test_menu_registry_0620"
          "${{ runner.temp }}/test_menu_registry_0620"
      - name: Verify JP0622 actual F6 modal state and original volume engine (ROM-free)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_audio_menu_state_0622.c \
            JP/recomp/native/enhanced/cviii_audio_levels_0618.c \
            JP/recomp/native/enhanced/cviii_audio_menu_state_test_0622.c \
            -o "${{ runner.temp }}/test_audio_menu_state_0622"
          "${{ runner.temp }}/test_audio_menu_state_0622"
      - name: Verify JP0623 namespaced Pause actions and authentic font layout
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_start_menu_0623.c \
            JP/recomp/native/enhanced/cviii_start_menu_test_0623.c \
            -o "${{ runner.temp }}/test_start_menu_0623"
          "${{ runner.temp }}/test_start_menu_0623"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_start_menu_0623.c \
            JP/recomp/native/enhanced/cviii_start_ui_0623.c \
            JP/recomp/native/enhanced/cviii_slot_picker_0625.c \
            JP/recomp/native/enhanced/cviii_start_ui_test_0623.c \
            -o "${{ runner.temp }}/test_start_ui_0623"
          "${{ runner.temp }}/test_start_ui_0623"
      - name: Verify JP0624 real generated F4 action shell under mock host (ROM-free)
        run: |
          python3 JP/decomp/tools/jp_start_pause_shell_test_0624.py --smoke
          python3 JP/decomp/tools/jp_start_pause_shell_test_0624.py
      - name: Verify JP0625 real Save/Load slot picker state 0-9 (ROM-free)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_slot_picker_0625.c \
            JP/recomp/native/enhanced/cviii_slot_picker_test_0625.c \
            -o "${{ runner.temp }}/test_slot_picker_0625"
          "${{ runner.temp }}/test_slot_picker_0625"
      - name: Verify JP0625 exact generated Save/Load SDL shell offline and netplay
        run: |
          python3 JP/decomp/tools/jp_slot_shell_test_0625.py --smoke
          python3 JP/decomp/tools/jp_slot_shell_test_0625.py
      - name: Execute JP0644 generated seventh-layer Save Load Audio interaction offline and netplay
        run: |
          python3 JP/recomp/tools/jp_menu_roundtrip_shell_test_0644.py --smoke
          python3 JP/recomp/tools/jp_menu_roundtrip_shell_test_0644.py
      - name: Verify JP0626 Audio child return preserves Pause focus (ROM-free)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_menu_stack_0626.c \
            JP/recomp/native/enhanced/cviii_start_menu_0623.c \
            JP/recomp/native/enhanced/cviii_audio_menu_state_0622.c \
            JP/recomp/native/enhanced/cviii_audio_levels_0618.c \
            JP/recomp/native/enhanced/cviii_menu_stack_test_0626.c \
            -o "${{ runner.temp }}/test_menu_stack_0626"
          "${{ runner.temp }}/test_menu_stack_0626"
      - name: Verify VRC6 CHR register mapping modes and physical offsets (ROM-free)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_chr_audit_0599.c \
            JP/recomp/native/enhanced/cviii_chr_audit_test_0599.c \
            -o "${{ runner.temp }}/test_chr_banks_0599"
          "${{ runner.temp }}/test_chr_banks_0599"
      - name: Validate read-only PPU fetch patch and synthetic bank-timeline parser
        run: |
          python3 JP/recomp/tools/patch_cyc_chr_fetch_0600.py --smoke
          python3 JP/recomp/tools/patch_cyc_ppu_nt_0606.py --smoke
          python3 JP/recomp/tools/jp_nt_trace_report_0606.py --smoke
          python3 JP/recomp/tools/jp_chr_fetch_report_0600.py --smoke
          python3 JP/recomp/tools/jp_frame_evidence_report_0601.py --smoke
          python3 JP/decomp/tools/jp_mapper_audit_0602.py --smoke
          python3 JP/decomp/tools/jp_qa_matrix_0602.py --smoke
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_chr_fetch_0600.c \
            JP/recomp/native/enhanced/cviii_chr_fetch_test_0600.c \
            -o "${{ runner.temp }}/test_chr_fetch_0600"
          "${{ runner.temp }}/test_chr_fetch_0600"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_frame_evidence_0601.c \
            JP/recomp/native/enhanced/cviii_frame_evidence_test_0601.c \
            -o "${{ runner.temp }}/test_frame_evidence_0601"
          "${{ runner.temp }}/test_frame_evidence_0601"
      - name: Verify real PPU nametable fetch counters on invented bus data
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic             JP/recomp/native/enhanced/cviii_nt_trace_0606.c             JP/recomp/native/enhanced/cviii_nt_trace_test_0606.c             -o "${{ runner.temp }}/test_nt_trace_0606"
          "${{ runner.temp }}/test_nt_trace_0606"
      - name: Verify JP0609 object/OAM rotation and logical drawing order
        run: |
          python3 JP/recomp/tools/jp_object_oam_report_0609.py --smoke
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_object_oam_trace_0609.c \
            JP/recomp/native/enhanced/cviii_object_oam_trace_test_0609.c \
            -o "${{ runner.temp }}/test_object_oam_0609"
          "${{ runner.temp }}/test_object_oam_0609"
      - name: Verify actual 2A03 + VRC6 audio register observation (ROM-free)
        run: |
          python3 JP/recomp/tools/patch_cyc_audio_bus_0610.py --smoke
          python3 JP/recomp/tools/jp_audio_bus_report_0610.py --smoke
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            JP/recomp/native/enhanced/cviii_audio_bus_0610.c \
            JP/recomp/native/enhanced/cviii_audio_bus_test_0610.c \
            -o "${{ runner.temp }}/test_audio_bus_0610"
          "${{ runner.temp }}/test_audio_bus_0610"
      - name: Validate JP0613 sound request/register proximity parser (ROM-free)
        run: python3 JP/decomp/tools/jp_sound_request_report_0613.py --smoke
      - name: Verify JP0612 sound entry dual fetch observer and logger (ROM-free)
