name: JP External NESRecomp C11 Cycle Mapper24 Smoke
on:
  push:
    branches: [decompilation]
    paths:
      - "JP/tools/test_cycle_synthetic_rom_0569.py"
      - "JP/tools/check_cycle_stats_0571.py"
      - "JP/tools/validate_cycle_media_0576.py"
      - "JP/tools/validate_frame_artifacts_0578.py"
      - "JP/native/enhanced/**"
      - "JP/tools/patch_cyc_savestates_0591.py"
      - "JP/tools/test_ppu_backend_0590.py"
      - "JP/tools/nesrecomp_cycle_0568.py"
      - "JP/tools/build_retail_cycle_0575.py"
      - "JP/native/nesrecomp_cycle/**"
      - ".github/workflows/jp_nesrecomp_cycle_mapper24.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mapper24-headless-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CVIII C11 integration
        uses: actions/checkout@v4
      - name: Checkout pinned external NESRecomp cycle engine (PolyForm Noncommercial 1.0.0)
        uses: actions/checkout@v4
        with:
          repository: mstan/nesrecomp
          ref: 2b4fcdb98c9e702be3fb365cfc645003c50b5fc1
          path: _external_nesrecomp
          persist-credentials: false
      - name: Verify external noncommercial license and cycle interface
        run: |
          grep -q "PolyForm Noncommercial License 1.0.0" _external_nesrecomp/LICENSE
          test -f _external_nesrecomp/runner/cyc/project.cmake
          python3 JP/tools/test_cycle_synthetic_rom_0569.py --smoke
      - name: Validate PPU diagnostic backend choice (no ROM)
        run: python3 JP/tools/test_ppu_backend_0590.py
      - name: Verify Original/Enhanced ten-slot save state host patch (no ROM)
        run: |
          python3 JP/tools/patch_cyc_savestates_0591.py --smoke
          python3 JP/tools/patch_cyc_savestates_0591.py \
            --source _external_nesrecomp/runner/cyc/cyc_sdl.c \
            --out _external_nesrecomp/runner/cyc/cviii_cyc_sdl_slots.c
          test -f _external_nesrecomp/runner/cyc/cviii_cyc_sdl_slots.c
      - name: Test Original/Enhanced C11 presentation extension (no ROM)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -I _external_nesrecomp/runner/cyc \
            JP/native/enhanced/cviii_edition.c JP/native/enhanced/cviii_chr_index_0598.c JP/native/enhanced/test_cviii_edition.c \
            -o "${{ runner.temp }}/test_cviii_edition"
          "${{ runner.temp }}/test_cviii_edition"
      - name: Generate noncommercial synthetic mapper24 VRC6 ROM
        run: python3 JP/tools/test_cycle_synthetic_rom_0569.py --out "${{ runner.temp }}/jp_mapper24_fixture.nes"
      - name: Configure CVIII external C11 cycle wrapper with exact synthetic fixture
        run: |
          python3 JP/tools/validate_cycle_media_0576.py --smoke
          cmake -S JP/native/nesrecomp_cycle \
                -B "${{ runner.temp }}/jp-vrc6-cycle" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DJP_ORIGINAL_JP_ROM="${{ runner.temp }}/jp_mapper24_fixture.nes" \
                -DNESRECOMP_EXTERNAL_ROOT="$PWD/_external_nesrecomp" \
                -DJP_CYCLE_SYNTHETIC_MEDIA=ON \
                -DJP_CYCLE_HEADLESS=ON
      - name: Compile upstream C11 cycle backend with VRC6
        run: cmake --build "${{ runner.temp }}/jp-vrc6-cycle" --config Release --parallel 4
      - name: Run and verify synthetic mapper24 native CPU cycles
        run: |
          set -eo pipefail
          "${{ runner.temp }}/jp-vrc6-cycle/jp_akumajou_densetsu" \
             "${{ runner.temp }}/jp_mapper24_fixture.nes" --frames 3 \
             --hash-out "${{ runner.temp }}/jp_vrc6_frame_hashes.txt" \
             --screenshot "${{ runner.temp }}/jp_vrc6_final_frame.png" \
             | tee "${{ runner.temp }}/jp_cycle_stdout.log"
          python3 JP/tools/check_cycle_stats_0571.py \
             --log "${{ runner.temp }}/jp_cycle_stdout.log" --frames 3
          python3 JP/tools/validate_frame_artifacts_0578.py \
             --hash-out "${{ runner.temp }}/jp_vrc6_frame_hashes.txt" \
             --screenshot "${{ runner.temp }}/jp_vrc6_final_frame.png" --frames 3
      - name: Verify synthetic save/load resumes exact machine frame hashes
        run: |
          set -euo pipefail
          exe="${{ runner.temp }}/jp-vrc6-cycle/jp_akumajou_densetsu"
          rom="${{ runner.temp }}/jp_mapper24_fixture.nes"
          state="${{ runner.temp }}/jp_mapper24_slot0.cycstate"
          "$exe" "$rom" --frames 20 --edition original \
            --save-state "8:$state" \
            --hash-out "${{ runner.temp }}/jp_straight_20.txt" \
            > "${{ runner.temp }}/jp_state_save.log"
          # Load the identical whole-machine snapshot using Enhanced
          # presentation. Edition toggles cannot change CPU/PPU state.
          "$exe" "$rom" --frames 20 --edition enhanced --unlimited-sprites 1 \
            --load-state "$state" \
            --hash-out "${{ runner.temp }}/jp_resumed_20.txt" \
            > "${{ runner.temp }}/jp_state_load.log"
          tail -n +10 "${{ runner.temp }}/jp_straight_20.txt" > "${{ runner.temp }}/jp_expected_resume.txt"
          cmp "${{ runner.temp }}/jp_expected_resume.txt" "${{ runner.temp }}/jp_resumed_20.txt"
          echo "PASS: 11/11 synthetic frames identical after Original save / Enhanced load"
      - name: Install SDL2 to compile actual windowed ten-slot UI host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev
      - name: Configure real windowed C11 host with numbered save slots
        run: |
          cmake -S JP/native/nesrecomp_cycle \
            -B "${{ runner.temp }}/jp-vrc6-window" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL2_DIR=/usr/lib/x86_64-linux-gnu/cmake/SDL2 \
            -DJP_ORIGINAL_JP_ROM="${{ runner.temp }}/jp_mapper24_fixture.nes" \
            -DNESRECOMP_EXTERNAL_ROOT="$PWD/_external_nesrecomp" \
            -DJP_CYCLE_SYNTHETIC_MEDIA=ON \
            -DJP_CYCLE_HEADLESS=OFF \
            -DJP_SAVE_STATE_SLOTS=ON \
            -DNESRECOMP_RECOMP_UI=OFF
      - name: Build executable with windowed SDL2 multi-slot quick saves
        run: cmake --build "${{ runner.temp }}/jp-vrc6-window" --config Release --parallel 4
