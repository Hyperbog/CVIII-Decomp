      - "JP/recomp/tools/jp_nt_trace_report_0606.py"
      - "JP/recomp/tools/patch_cyc_audio_bus_0610.py"
      - "JP/recomp/tools/patch_cyc_sound_requests_0612.py"
      - "JP/recomp/tools/patch_cyc_sound_decisions_0646.py"
      - "JP/decomp/tools/jp_dmc_original_source_0648.py"
      - "JP/decomp/tools/jp_sound_catalog_0652.py"
      - "JP/decomp/tools/jp_phrase_lookup_0653.py"
      - "JP/decomp/tools/jp_phrase_delta_0655.py"
      - "JP/decomp/tools/jp_phrase_control_0656.py"
      - "JP/decomp/tools/jp_room_catalog_0657.py"
      - "JP/decomp/tools/jp_room_coordinate_0657.py"
      - "JP/decomp/tools/jp_room_clear_0658.py"
      - "JP/decomp/tools/jp_room_stream_0659.py"
      - "JP/decomp/tools/jp_room_resources_0659.py"
      - "JP/recomp/tools/test_control_profiles_0661.py"
      - "JP/decomp/tools/jp_dpcm_memory_audit_0649.py"
      - "JP/recomp/tools/patch_cyc_dmc_dma_trace_0650.py"
      - "JP/decomp/tools/jp_dmc_dma_trace_verify_0650.py"
      - "JP/decomp/tools/patch_mesen_dmc_reference_0651.py"
      - "JP/decomp/tools/jp_mesen_dmc_dma_compare_0651.py"
      - "JP/recomp/tools/jp_audio_bus_report_0610.py"
      - "JP/recomp/tools/jp_audio_session_verify_0614.py"
      - "JP/decomp/tools/jp_mesen_sound_requests_0615.py"
      - "JP/decomp/tools/jp_sound_priority_paths_0616.py"
      - "JP/decomp/tools/jp_mesen_gate_report_0616.py"
      - "JP/decomp/tools/jp_sound_decision_reference_0617.py"
      - "JP/decomp/tools/jp_audio_ui_chr_0619.py"
