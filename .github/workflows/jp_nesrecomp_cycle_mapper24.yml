      - name: Verify JP0656 complete sound control grammar and 327680 native C11 cases (ROM-free)
        run: |
          python3 JP/decomp/tools/jp_phrase_control_0656.py --smoke
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -DNDEBUG \
            JP/recomp/native/enhanced/cviii_phrase_control_0656.c \
            JP/recomp/native/enhanced/cviii_phrase_control_test_0656.c \
            -o "${{ runner.temp }}/jp_phrase_control_test_0656"
          "${{ runner.temp }}/jp_phrase_control_test_0656"
      - name: Verify JP0657 room-hierarchy and 131072 coordinate C11 cases (ROM-free)
        run: |
          python3 JP/decomp/tools/jp_room_catalog_0657.py --smoke
