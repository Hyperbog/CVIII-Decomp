name: JP External NESRecomp C11 Cycle Mapper24 Smoke
on:
  push:
    branches: [decompilation]
    paths:
      - "JP/tools/test_cycle_synthetic_rom_0569.py"
      - "JP/tools/check_cycle_stats_0571.py"
      - "JP/tools/validate_cycle_media_0576.py"
      - "JP/native/nesrecomp_cycle/**"
      - ".github/workflows/jp_nesrecomp_cycle_mapper24.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mapper24-headless-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CVIII C11 integration
        uses: actions/checkout@v4
      - name: Checkout pinned external NESRecomp cycle engine (PolyForm Noncommercial 1.0.0)
        uses: actions/checkout@v4
        with:
          repository: mstan/nesrecomp
          ref: 2b4fcdb98c9e702be3fb365cfc645003c50b5fc1
          path: _external_nesrecomp
          persist-credentials: false
      - name: Verify external noncommercial license and cycle interface
        run: |
          grep -q "PolyForm Noncommercial License 1.0.0" _external_nesrecomp/LICENSE
          test -f _external_nesrecomp/runner/cyc/project.cmake
          python3 JP/tools/test_cycle_synthetic_rom_0569.py --smoke
      - name: Generate noncommercial synthetic mapper24 VRC6 ROM
        run: python3 JP/tools/test_cycle_synthetic_rom_0569.py --out "${{ runner.temp }}/jp_mapper24_fixture.nes"
      - name: Configure CVIII external C11 cycle wrapper with exact synthetic fixture
        run: |
          python3 JP/tools/validate_cycle_media_0576.py --smoke
          cmake -S JP/native/nesrecomp_cycle \
                -B "${{ runner.temp }}/jp-vrc6-cycle" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DJP_ORIGINAL_JP_ROM="${{ runner.temp }}/jp_mapper24_fixture.nes" \
                -DNESRECOMP_EXTERNAL_ROOT="$PWD/_external_nesrecomp" \
                -DJP_CYCLE_SYNTHETIC_MEDIA=ON \
                -DJP_CYCLE_HEADLESS=ON
      - name: Compile upstream C11 cycle backend with VRC6
        run: cmake --build "${{ runner.temp }}/jp-vrc6-cycle" --config Release --parallel 4
      - name: Run and verify synthetic mapper24 native CPU cycles
        run: |
          set -eo pipefail
          "${{ runner.temp }}/jp-vrc6-cycle/jp_akumajou_densetsu" \
             "${{ runner.temp }}/jp_mapper24_fixture.nes" --frames 3 \
             | tee "${{ runner.temp }}/jp_cycle_stdout.log"
          python3 JP/tools/check_cycle_stats_0571.py \
             --log "${{ runner.temp }}/jp_cycle_stdout.log" --frames 3
