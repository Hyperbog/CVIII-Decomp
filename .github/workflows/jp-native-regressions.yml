  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate weighted evidence rubric
        run: python3 JP/decomp/tools/progress_score.py
      - name: Compile native source-level regressions and audit evidence provenance
        run: bash JP/decomp/tools/run_native_regressions.sh
      - name: Configure headless native CMake package and run CTest
        run: |
          cmake -S JP/decomp/legacy/native0509 -B /tmp/cviii-native0509 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/cviii-native0509 --parallel 2
          ctest --test-dir /tmp/cviii-native0509 --output-on-failure
      - name: Build ROM-independent native actor and sprite pipeline
        run: |
          cmake -S JP/decomp/legacy/standalone0509 -B /tmp/cviii-standalone0509 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/cviii-standalone0509 --parallel 2
          ctest --test-dir /tmp/cviii-standalone0509 --output-on-failure
      - name: Audit preservation archive
        run: python3 JP/decomp/tools/audit_preservation_archive.py
