      - 'JP/analysis/0521_original_mesen_animation_report.json'
      - 'JP/tools/progress_score.py'
      - 'JP/analysis/PROGRESS_SCORE.csv'
      - '.github/workflows/jp-native-regressions.yml'
  pull_request:
    paths:
      - 'JP/src/**'
      - 'JP/native0509/**'
      - 'JP/standalone0509/**'
      - 'JP/tools/native_probe_0509.cpp'
      - 'JP/tools/standalone_preview_0509.cpp'
      - 'JP/tools/audit_actor_slot_0509.py'
      - 'JP/tools/test_native_mesen_pc_0509.py'
      - 'JP/SharedNES/**'
      - 'JP/tools/nes_*.py'
      - 'JP/tools/audit_mesen_*.py'
      - 'JP/tools/mesen_0508_frame_state.lua'
      - 'JP/tests/**'
      - 'JP/tools/run_native_regressions.sh'
      - 'JP/tools/audit_prg_recomp_0525.py'
      - 'JP/tools/test_recomp_6502_0525.py'
      - 'JP/tools/audit_historical_prg_0526.py'
      - 'JP/tools/audit_bank05_certificate_0527.py'
      - 'JP/tools/build_whole_cart_recomp_0529.py'
      - 'JP/tools/lift_fixed_dispatch_0530.py'
      - 'JP/tools/lift_bank05_scripts_0531.py'
      - 'JP/tools/lift_bank04_parser_0532.py'
      - 'JP/tools/lift_bank0c_sound_0533.py'
      - 'JP/tools/lift_sound_phrase_ai_0534.py'
      - 'JP/tools/lift_bank0a_state_0535.py'
      - 'JP/tools/test_bank0a_state_0535.py'
      - 'JP/tools/test_sound_phrase_ai_0534.py'
      - 'JP/tools/test_bank0c_sound_0533.py'
      - 'JP/tools/test_bank04_parser_0532.py'
      - 'JP/tools/test_recomp_6502_0526.py'
      - 'JP/recomp/**'
      - 'JP/tools/audit_native_evidence_ledger.py'
      - 'JP/tools/audit_native_coverage_0518.py'
      - 'JP/tools/audit_animation_ef93_0521.py'
      - 'JP/tools/audit_fe63_0522_rom.py'
      - 'JP/tools/audit_actor_reset_0523_rom.py'
      - 'JP/tools/audit_linked_actor_0524_rom.py'
      - 'JP/analysis/NATIVE_EVIDENCE_LEDGER.json'
      - 'JP/analysis/0521_original_mesen_animation_report.json'
      - 'JP/tools/progress_score.py'
      - 'JP/analysis/PROGRESS_SCORE.csv'
      - '.github/workflows/jp-native-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate weighted evidence rubric
        run: python3 JP/tools/progress_score.py
      - name: Compile native source-level regressions and audit evidence provenance
        run: bash JP/tools/run_native_regressions.sh
      - name: Configure headless native CMake package and run CTest
        run: |
          cmake -S JP/native0509 -B /tmp/cviii-native0509 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/cviii-native0509 --parallel 2
          ctest --test-dir /tmp/cviii-native0509 --output-on-failure
      - name: Build ROM-independent native actor and sprite pipeline
        run: |
          cmake -S JP/standalone0509 -B /tmp/cviii-standalone0509 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/cviii-standalone0509 --parallel 2
          ctest --test-dir /tmp/cviii-standalone0509 --output-on-failure
      - name: Audit preservation archive
        run: python3 JP/tools/audit_preservation_archive.py
