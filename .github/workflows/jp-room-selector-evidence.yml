name: JP Room Selector Evidence Gates
on:
  push:
    branches: [decompilation]
    paths:
      - 'JP/tools/audit_room_selector_window_0628.py'
      - 'JP/tools/audit_room_selector_table_0629.py'
      - 'JP/tools/audit_mesen_room_selector_trace_0629.py'
      - 'JP/tools/audit_mesen_room_chain_0630.py'
      - 'JP/tools/mesen_jp_room_selector_provenance_0629.lua'
      - 'JP/tools/mesen_jp_room_chain_0630.lua'
      - 'JP/analysis/0628_*'
      - 'JP/analysis/0629_*'
      - 'JP/analysis/0630_*'
      - '.github/workflows/jp-room-selector-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-contract:
    name: ROM-free selector contract
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile ROM-free selector parser sources
        run: python -m py_compile JP/tools/audit_room_selector_window_0628.py JP/tools/audit_room_selector_table_0629.py JP/tools/audit_mesen_room_selector_trace_0629.py JP/tools/audit_mesen_room_chain_0630.py
      - name: Check JP0628 conditional selector smoke
        run: python JP/tools/audit_room_selector_window_0628.py --smoke
      - name: Check JP0629 mapper/chronology tamper smoke
        run: python JP/tools/audit_mesen_room_selector_trace_0629.py --smoke
      - name: Check JP0630 room pointer postcondition smoke
        run: python JP/tools/audit_mesen_room_chain_0630.py --smoke
